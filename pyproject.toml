[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-anomaly-detector"
version = "1.0.0"
description = "AI Agent Anomaly Detection System for OpenClaw"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Agent Anomaly Detector Contributors"},
]
keywords = ["ai", "security", "anomaly-detection", "openclaw", "agent-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
openclaw = [
    # "openclaw-sdk>=1.0.0",  # 如果 OpenClaw 有官方 SDK
]

[project.urls]
Homepage = "https://github.com/yourusername/agent-anomaly-detector"
Repository = "https://github.com/yourusername/agent-anomaly-detector"
Issues = "https://github.com/yourusername/agent-anomaly-detector/issues"

[project.scripts]
detect-anomaly = "scripts.detect_anomaly:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts", "config", "docs", "references", "assets", "tests", "utils"]

[tool.setuptools.package-data]
"agent_anomaly_detector" = [
    "config/*.example",
    "docs/*.md",
    "references/*.md",
    "assets/*.md",
]

# 代码格式化配置
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

# 代码检查配置
[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", "*.egg-info"]

# 类型检查配置
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true